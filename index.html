<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ROUTINE">
  <title>ROUTINE</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg:           #08080F;
      --bg-card:      #10101A;
      --bg-input:     #18182A;
      --border:       #252535;
      --accent:       #FF5500;
      --accent-glow:  rgba(255,85,0,0.15);
      --accent-border:rgba(255,85,0,0.35);
      --text:         #EEEEF8;
      --text-dim:     #8888AA;
      --text-muted:   #3D3D55;
      --success:      #22C55E;
      --danger:       #EF4444;
      --indigo:       #6366F1;
      --indigo-glow:  rgba(99,102,241,0.12);
      --indigo-border:rgba(99,102,241,0.35);
      --radius:       16px;
      --radius-sm:    10px;
      --font-d:       'Bebas Neue', sans-serif;
      --font-b:       'Noto Sans JP', sans-serif;
    }

    html { width:100vw; max-width:100vw; overflow-x:hidden; -webkit-text-size-adjust:100%; }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; max-width:100%; }
    body {
      background:var(--bg); color:var(--text); font-family:var(--font-b);
      width:100vw; max-width:100vw; min-height:100vh; min-height:100dvh;
      overflow-x:hidden; overflow-y:auto; position:relative;
    }

    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; width:100vw; max-width:100vw;
      background:var(--bg-card); border-top:1px solid var(--border);
      display:flex; padding-bottom:env(safe-area-inset-bottom,0px); z-index:50;
    }
    .nav-btn {
      flex:1; padding:12px 8px 10px;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      cursor:pointer; border:none; background:none; font-family:var(--font-b); transition:all 0.15s;
    }
    .nav-icon  { font-size:20px; line-height:1; }
    .nav-label { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
    .nav-btn.active .nav-label { color:var(--accent); }
    .nav-btn.active .nav-icon  { transform:scale(1.1); }

    .app-panel { display:none; padding-bottom:80px; width:100vw; max-width:100vw; overflow-x:hidden; }
    .app-panel.active { display:block; }

    .header {
      padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 0;
      position:relative; overflow:hidden; width:100%;
    }
    .header::after {
      content:''; position:absolute; top:0; left:0; right:0; height:220px; pointer-events:none;
    }
    .header-row { display:flex; justify-content:space-between; align-items:flex-start; }
    .app-sub   { font-size:10px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
    .date-block { text-align:right; }
    .date-dow  { font-size:11px; color:var(--accent); letter-spacing:1px; }
    .date-full { font-family:var(--font-d); font-size:24px; letter-spacing:1px; line-height:1.2; color:var(--accent); }

    #panel-night .header::after { background:radial-gradient(ellipse at 50% -20%,rgba(99,102,241,0.14) 0%,transparent 70%); }
    #panel-night .app-name { font-family:var(--font-d); font-size:38px; letter-spacing:3px; color:var(--indigo); line-height:1; }
    #panel-fitlog .header::after { background:radial-gradient(ellipse at 50% -20%,rgba(255,85,0,0.12) 0%,transparent 70%); }
    #panel-fitlog .app-name { font-family:var(--font-d); font-size:40px; letter-spacing:3px; color:var(--accent); line-height:1; }

    .today-badge { margin-top:14px; display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:var(--radius); }
    .badge-icon  { font-size:22px; }
    .badge-label { font-size:10px; color:#111111; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
    .badge-title { font-size:16px; font-weight:700; color:var(--accent); }
    #panel-night  .today-badge { background:var(--indigo-glow); border:1px solid var(--indigo-border); }
    #panel-fitlog .today-badge { background:var(--accent-glow); border:1px solid var(--accent-border); }

    .content {
      padding:16px 20px; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
      width:100vw; max-width:100vw; overflow-x:hidden; box-sizing:border-box;
    }
    .sec-label { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
    .section { margin-bottom:22px; }

    .progress-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; }
    .progress-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .progress-lbl  { font-size:12px; color:var(--text-dim); }
    .progress-num  { font-family:var(--font-d); font-size:26px; letter-spacing:1px; }
    .progress-bar  { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:2px; transition:width 0.4s cubic-bezier(0.4,0,0.2,1); }
    #panel-night  .progress-num  { color:var(--indigo); }
    #panel-night  .progress-fill { background:linear-gradient(90deg,var(--indigo),#A5B4FC); }
    #panel-night  .progress-fill.done-all { background:linear-gradient(90deg,var(--success),#4ADE80); }
    #panel-fitlog .progress-num  { color:var(--accent); }
    #panel-fitlog .progress-fill { background:linear-gradient(90deg,var(--accent),#FF8844); }

    .copy-btn {
      width:100%; padding:17px; background:var(--accent); color:white; border:none;
      border-radius:var(--radius); font-family:var(--font-b); font-size:15px; font-weight:700;
      cursor:pointer; margin-top:6px; margin-bottom:10px;
      box-shadow:0 6px 30px rgba(255,85,0,0.35); transition:all 0.2s; letter-spacing:0.5px;
    }
    .copy-btn:active { transform:scale(0.98); opacity:0.9; }
    .copy-btn.ok { background:var(--success); box-shadow:0 6px 30px rgba(34,197,94,0.35); }

    .week-strip {
      display:flex; gap:6px; margin:16px 20px 0;
      overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
      width:calc(100vw - 40px); max-width:calc(100vw - 40px);
    }
    .week-strip::-webkit-scrollbar { display:none; }
    .day-pill {
      flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px;
      padding:9px 12px; border-radius:var(--radius-sm);
      border:1px solid var(--border); background:var(--bg-card);
      cursor:pointer; transition:all 0.18s; min-width:44px;
    }
    .day-pill:active { opacity:0.7; transform:scale(0.97); }
    .day-pill.active { border-color:var(--indigo); background:var(--indigo-glow); }
    .day-pill.today .dp-name { color:var(--accent); }
    .dp-name { font-size:11px; color:var(--text-dim); font-weight:500; }
    .dp-icon { font-size:14px; line-height:1; }
    .dp-dots { display:flex; gap:2px; height:5px; align-items:center; }
    .dp-dot  { width:4px; height:4px; border-radius:50%; background:var(--text-muted); }
    .dp-dot.done       { background:var(--success); }
    .dp-dot.active-day { background:var(--indigo); }

    .task-card {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
      display:flex; align-items:center; gap:14px;
      cursor:pointer; transition:border-color 0.2s,background 0.2s;
      -webkit-user-select:none; user-select:none;
    }
    .task-card:active { opacity:0.8; transform:scale(0.99); }
    .task-card.done   { border-color:var(--success); background:rgba(34,197,94,0.06); }
    .task-check {
      width:42px; height:42px; border-radius:50%; border:2px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0; transition:all 0.2s; color:transparent;
    }
    .task-card.done .task-check { background:var(--success); border-color:var(--success); color:white; }
    .task-info { flex:1; min-width:0; }
    .task-name { font-size:14px; font-weight:500; color:var(--text); }
    .task-card.done .task-name { color:var(--success); }
    .task-status { font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--text-muted); flex-shrink:0; }
    .task-card.done .task-status { color:var(--success); }

    .complete-banner {
      display:none; background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.35);
      border-radius:var(--radius); padding:16px; margin-bottom:16px; text-align:center;
    }
    .complete-banner.show { display:block; }
    .complete-banner-icon { font-size:28px; margin-bottom:6px; }
    .complete-banner-text { font-size:14px; font-weight:700; color:var(--success); }
    .complete-banner-sub  { font-size:12px; color:var(--text-dim); margin-top:4px; }

    .tabs {
      display:flex; margin:16px 20px 0;
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius); padding:4px; gap:4px;
      width:calc(100vw - 40px); max-width:calc(100vw - 40px); box-sizing:border-box;
    }
    .tab {
      flex:1; padding:11px 8px; text-align:center;
      font-size:13px; font-weight:500; border-radius:var(--radius-sm);
      cursor:pointer; transition:all 0.2s; color:var(--text-dim);
      border:none; background:none; font-family:var(--font-b);
    }
    .tab.active { background:var(--accent); color:#fff; font-weight:700; box-shadow:0 4px 20px rgba(255,85,0,0.4); }
    .tab-panel        { display:none; }
    .tab-panel.active { display:block; }

    .metrics-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; box-sizing:border-box; }
    .metric-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 14px; }
    .metric-label { font-size:11px; color:var(--text-dim); margin-bottom:6px; }
    .metric-row   { display:flex; align-items:baseline; gap:4px; }
    .metric-input {
      background:none; border:none; outline:none; color:var(--text);
      font-family:var(--font-d); font-size:36px; letter-spacing:1px; width:100%; caret-color:var(--accent);
    }
    .metric-unit { font-size:14px; color:var(--text-dim); flex-shrink:0; }

    .sq-btn {
      flex:1; padding:6px 4px; background:var(--bg-input);
      border:1px solid var(--border); border-radius:var(--radius-sm);
      font-size:18px; cursor:pointer; transition:all 0.15s;
    }
    .sq-btn.active { border-color:var(--accent); background:var(--accent-glow); }

    .note-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
    .note-input {
      width:100%; background:none; border:none; outline:none;
      color:var(--text); font-family:var(--font-b); font-size:14px; resize:none; line-height:1.7;
    }
    .note-input::placeholder { color:var(--text-muted); }

    .meal-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; overflow:hidden; width:100%; box-sizing:border-box; }
    .meal-label { font-size:11px; font-weight:700; color:var(--accent); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
    .meal-add-row { display:flex; gap:8px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
    .meal-inline-name { flex:1; min-width:0; font-size:13px; padding:8px 0; border-bottom:1px solid var(--border); background:none; border-top:none; border-left:none; border-right:none; outline:none; color:var(--text); font-family:var(--font-b); }
    .meal-inline-name::placeholder { color:var(--text-muted); }
    .meal-inline-kcal { width:60px; flex-shrink:0; font-size:13px; padding:8px 0; text-align:right; border-bottom:1px solid var(--border); background:none; border-top:none; border-left:none; border-right:none; outline:none; color:var(--text); font-family:var(--font-b); }
    .meal-inline-kcal::placeholder { color:var(--text-muted); }
    .meal-inline-kcal.estimated { border-color:var(--success); color:var(--success); }
    .meal-ai-btn {
      width:32px; height:32px; flex-shrink:0; background:var(--bg-input); color:var(--accent);
      border:1px solid var(--accent-border); border-radius:50%; font-size:14px;
      cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s;
    }
    .meal-ai-btn:active { background:var(--accent-glow); }
    .meal-add-btn {
      width:32px; height:32px; flex-shrink:0; background:var(--accent); color:white;
      border:none; border-radius:50%; font-size:18px; line-height:1; cursor:pointer;
      box-shadow:0 3px 12px rgba(255,85,0,0.35); display:flex; align-items:center; justify-content:center;
    }
    .meal-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .meal-item:last-child { border-bottom:none; }
    .meal-item-name { flex:1; min-width:0; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meal-item-kcal { color:var(--text-dim); font-size:12px; flex-shrink:0; }
    .meal-item-del  { background:none; border:none; color:var(--text-muted); font-size:14px; cursor:pointer; padding:2px 4px; flex-shrink:0; }

    .prep-alert {
      background:var(--accent-glow); border:1px solid var(--accent-border);
      border-radius:var(--radius-sm); padding:11px 14px; margin-bottom:14px;
      font-size:12px; color:#FF8844; line-height:1.5;
    }

    .ex-card {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius); padding:15px 16px; margin-bottom:10px;
      display:flex; align-items:center; gap:14px;
      cursor:pointer; transition:border-color 0.2s,background 0.2s;
      -webkit-user-select:none; user-select:none;
    }
    .ex-card:active { opacity:0.8; transform:scale(0.99); }
    .ex-card.done   { border-color:var(--success); background:rgba(34,197,94,0.06); }
    .ex-card.failed { border-color:var(--danger);  background:rgba(239,68,68,0.06); }
    .ex-check {
      width:42px; height:42px; border-radius:50%; border:2px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0; transition:all 0.2s; color:transparent;
    }
    .ex-card.done   .ex-check { background:var(--success); border-color:var(--success); color:white; }
    .ex-card.failed .ex-check { background:var(--danger);  border-color:var(--danger);  color:white; }
    .ex-info { flex:1; min-width:0; }
    .ex-name { font-size:14px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ex-target { font-size:11px; color:var(--text-dim); margin-top:3px; }
    .ex-status { font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--text-muted); flex-shrink:0; }
    .ex-card.done   .ex-status { color:var(--success); }
    .ex-card.failed .ex-status { color:var(--danger); }

    .rest-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:50px 20px; text-align:center; }
    .rest-icon  { font-size:52px; margin-bottom:14px; }
    .rest-title { font-size:20px; font-weight:700; margin-bottom:8px; }
    .rest-text  { font-size:13px; color:var(--text-dim); line-height:1.7; }

    /* RUNNING LOG */
    .run-log-wrap { margin-bottom:10px; }
    .run-log-inputs { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .run-log-field { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 14px; }
    .run-log-label { font-size:11px; color:var(--text-dim); margin-bottom:6px; }
    .run-log-val-row { display:flex; align-items:baseline; gap:4px; }
    .run-log-input {
      background:none; border:none; outline:none; color:var(--text);
      font-family:var(--font-d); font-size:36px; letter-spacing:1px; width:100%;
      caret-color:var(--accent); -webkit-appearance:none; -moz-appearance:textfield;
    }
    .run-log-input::-webkit-inner-spin-button,
    .run-log-input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
    .run-log-input::placeholder { color:var(--text-muted); }
    .run-log-unit { font-size:14px; color:var(--text-dim); flex-shrink:0; }
    .run-log-save {
      width:100%; padding:14px; background:var(--accent); border:none;
      border-radius:var(--radius); color:white; font-family:var(--font-b);
      font-size:15px; font-weight:700; cursor:pointer; letter-spacing:0.5px;
      box-shadow:0 4px 20px rgba(255,85,0,0.3); transition:all 0.2s; margin-bottom:12px;
    }
    .run-log-save:active { transform:scale(0.98); opacity:0.9; }
    .run-log-month { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; font-size:12px; color:var(--text-dim); }
    .run-log-month b { color:var(--accent); font-size:16px; }

  </style>
</head>
<body>

<div class="bottom-nav">
  <button class="nav-btn active" id="nav-night" onclick="window.switchApp('night')">
    <span class="nav-icon">🌙</span><span class="nav-label">NIGHT</span>
  </button>
  <button class="nav-btn" id="nav-fitlog" onclick="window.switchApp('fitlog')">
    <span class="nav-icon">💪</span><span class="nav-label">FITLOG</span>
  </button>
</div>

<!-- NIGHT -->
<div class="app-panel active" id="panel-night">
  <div class="header">
    <div class="header-row">
      <div><div class="app-name">NIGHT</div><div class="app-sub">Evening Routine Tracker</div></div>
      <div class="date-block">
        <div class="date-dow" id="n-dowDisplay"></div>
        <div class="date-full" id="n-dateDisplay"></div>
      </div>
    </div>
    <div class="today-badge">
      <div class="badge-icon" id="n-todayIcon"></div>
      <div><div class="badge-label">TONIGHT</div><div class="badge-title" id="n-todayTitle"></div></div>
    </div>
  </div>
  <div class="week-strip" id="n-weekStrip"></div>
  <div class="content">
    <div class="complete-banner" id="n-completeBanner">
      <div class="complete-banner-icon">🌙</div>
      <div class="complete-banner-text">今夜のルーティン完了！</div>
      <div class="complete-banner-sub">お疲れ様でした。ゆっくり休んでください。</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-head">
        <span class="progress-lbl">今夜の達成状況</span>
        <span class="progress-num" id="n-progressNum">0/0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="n-progressFill" style="width:0%"></div></div>
    </div>
    <div class="section">
      <div class="sec-label">タイムライン</div>
      <div id="n-taskList"></div>
    </div>
  </div>
</div>

<!-- FITLOG -->
<div class="app-panel" id="panel-fitlog">
  <div class="header">
    <div class="header-row">
      <div><div class="app-name">FITLOG</div><div class="app-sub">Goal: David's Physique</div></div>
      <div class="date-block">
        <div class="date-dow" id="f-dowDisplay"></div>
        <div class="date-full" id="f-dateDisplay"></div>
      </div>
    </div>
    <div class="today-badge">
      <div class="badge-icon" id="f-todayIcon"></div>
      <div><div class="badge-label">TODAY</div><div class="badge-title" id="f-todayTitle"></div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="window.switchTab('morning')">🌅 朝の記録</button>
    <button class="tab"        onclick="window.switchTab('meal')">🍽 食事</button>
    <button class="tab"        onclick="window.switchTab('training')">💪 トレーニング</button>
  </div>

  <div class="content">
    <!-- 朝の記録 -->
    <div id="f-panel-morning" class="tab-panel active">
      <div class="section">
        <div class="sec-label">身体データ</div>
        <div class="metrics-row">
          <div class="metric-card">
            <div class="metric-label">体重</div>
            <div class="metric-row">
              <input class="metric-input" id="f-weight" type="number" oninput="window.saveMorning()" step="0.1" placeholder="65.0" inputmode="decimal">
              <span class="metric-unit">kg</span>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-label">体脂肪率</div>
            <div class="metric-row">
              <input class="metric-input" id="f-bodyfat" type="number" oninput="window.saveMorning()" step="0.1" placeholder="18.0" inputmode="decimal">
              <span class="metric-unit">%</span>
            </div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="sec-label">睡眠</div>
        <div class="metrics-row">
          <div class="metric-card">
            <div class="metric-label">睡眠時間</div>
            <div class="metric-row">
              <input class="metric-input" id="f-sleep-hours" type="number" oninput="window.saveMorning()" step="0.5" placeholder="7.0" inputmode="decimal">

<script>
(function(){
  var DAYS_JP   = ['日','月','火','水','木','金','土'];
  var DAY_TYPES = ['rest','piano','run','rest','run','base','run'];
  var TYPE_META = {
    run:   { icon:'🏃', label:'トレーニング＋ランニングの日' },
    piano: { icon:'🎹', label:'トレーニング＋ピアノの日'     },
    base:  { icon:'💪', label:'トレーニングの日'              },
    rest:  { icon:'😴', label:'休養日'                       }
  };
  var SCHEDULES = {
    rest:  [
      { key:'read',  icon:'📖', name:'読書' }
    ],
    base:  [
      { key:'train', icon:'💪', name:'トレーニング' },
      { key:'read',  icon:'📖', name:'読書' }
    ],
    run:   [
      { key:'train', icon:'💪', name:'トレーニング' },
      { key:'run',   icon:'🏃', name:'ランニング' },
      { key:'read',  icon:'📖', name:'読書' }
    ],
    piano: [
      { key:'train', icon:'💪', name:'トレーニング' },
      { key:'piano', icon:'🎹', name:'ピアノ' },
      { key:'read',  icon:'📖', name:'読書' }
    ]
  };

  var now          = new Date();
  var todayDow     = now.getDay();
  var todayType    = DAY_TYPES[todayDow];
  var dayOfWeek    = now.getDay();
  var mondayOffset = (dayOfWeek===0) ? -6 : -(dayOfWeek-1);
  var selectedOffset = 0;

  function pad(n){ return String(n).padStart(2,'0'); }
  function lsGet(key){ try{ return JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){ return {}; } }
  function lsSet(key,obj){ try{ localStorage.setItem(key,JSON.stringify(obj)); }catch(e){} }
  function stateKey(d){ return 'night_'+d.getFullYear()+'_'+(d.getMonth()+1)+'_'+d.getDate(); }

  document.getElementById('n-dowDisplay').textContent  = DAYS_JP[todayDow]+'曜日';
  document.getElementById('n-dateDisplay').textContent = now.getFullYear()+'.'+pad(now.getMonth()+1)+'.'+pad(now.getDate());
  document.getElementById('n-todayIcon').textContent   = TYPE_META[todayType].icon;
  document.getElementById('n-todayTitle').textContent  = TYPE_META[todayType].label;

  function renderWeekStrip(){
    var strip = document.getElementById('n-weekStrip');
    strip.innerHTML = '';
    for(var i=0;i<7;i++){
      var offset = mondayOffset+i;
      var d = new Date(now); d.setDate(d.getDate()+offset);
      var dow   = d.getDay();
      var type  = DAY_TYPES[dow];
      var icon  = TYPE_META[type].icon;
      var key   = stateKey(d);
      var st    = lsGet(key);
      var tasks = SCHEDULES[type];
      var isToday    = (offset===0);
      var isSelected = (offset===selectedOffset);
      var pill = document.createElement('div');
      pill.className = 'day-pill'+(isSelected?' active':'')+(isToday?' today':'');
      var dotsHtml = tasks.map(function(t){
        var cls = st[t.key]?'done':(isSelected?'active-day':'');
        return '<div class="dp-dot '+cls+'"></div>';
      }).join('');
      pill.innerHTML =
        '<div class="dp-name">'+DAYS_JP[dow]+'</div>'+
        '<div class="dp-icon">'+icon+'</div>'+
        '<div class="dp-dots">'+dotsHtml+'</div>';
      (function(off){ pill.addEventListener('click',function(){ selectedOffset=off; renderWeekStrip(); renderTasks(); }); })(offset);
      strip.appendChild(pill);
    }
    var active = strip.querySelector('.day-pill.active');
    if(active) active.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  }

  function renderTasks(){
    var d = new Date(now); d.setDate(d.getDate()+selectedOffset);
    var dow   = d.getDay();
    var type  = DAY_TYPES[dow];
    var key   = stateKey(d);
    var st    = lsGet(key);
    var tasks = SCHEDULES[type];
    var doneCount = tasks.filter(function(t){ return st[t.key]; }).length;
    var total = tasks.length;
    var pct   = total ? (doneCount/total*100) : 0;

    document.getElementById('n-progressNum').textContent = doneCount+'/'+total;
    var fill = document.getEle
