<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DAILY LOG">
  <title>DAILY LOG</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0F172A;--card:#1E293B;--border:#334155;
      --accent:#FF5500;--text:#F1F5F9;--dim:#94A3B8;
      --muted:#475569;--done:#22C55E;
      --done-bg:rgba(34,197,94,0.1);--done-border:rgba(34,197,94,0.4);
      --fd:'Bebas Neue',sans-serif;--fb:'Noto Sans JP',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);
      min-height:100dvh;padding-bottom:40px;position:relative;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.5;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");}
    body::after{content:'';position:fixed;top:0;left:0;right:0;height:3px;z-index:1;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);}
    .wrap{position:relative;z-index:1;}
    .hdr{padding:calc(env(safe-area-inset-top,16px) + 16px) 18px 14px;border-bottom:1px solid var(--border);}
    .hdr-date{font-family:var(--fd);font-size:34px;letter-spacing:2px;line-height:1;}
    .hdr-day{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:4px;}
    .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
    .tag{background:rgba(255,85,0,0.08);border:1px solid rgba(255,85,0,0.2);color:var(--accent);
      border-radius:20px;padding:2px 9px;font-size:10px;font-weight:600;}
    .sec{padding:14px 18px 0;}
    .sec-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:10px;}
    .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .m-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
    .m-name{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px;}
    .m-row{display:flex;align-items:baseline;gap:4px;}
    .m-in{background:none;border:none;color:var(--text);font-family:var(--fd);font-size:30px;
      letter-spacing:1px;width:80px;outline:none;-webkit-appearance:none;}
    .m-in::placeholder{color:var(--muted);}
    .m-unit{font-size:12px;color:var(--dim);}
    .r-stack{display:flex;flex-direction:column;gap:7px;}
    .r-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
      padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
      cursor:pointer;transition:border-color .2s,background .2s;user-select:none;-webkit-user-select:none;}
    .r-card:active{opacity:.85;}
    .r-card.done{border-color:var(--done-border);background:var(--done-bg);}
    .r-left{display:flex;align-items:center;gap:12px;}
    .r-ico{font-size:20px;width:26px;text-align:center;}
    .r-lbl{font-size:15px;font-weight:500;transition:color .2s;}
    .r-card.done .r-lbl{color:var(--done);}
    .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);
      display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
    .r-card.done .chk{background:var(--done);border-color:var(--done);}
    .chk svg{opacity:0;transition:opacity .2s;}
    .r-card.done .chk svg{opacity:1;}
    .rest{background:var(--card);border:1px solid var(--border);border-radius:12px;
      padding:18px;text-align:center;color:var(--dim);font-size:13px;}
    .f-stack{display:flex;flex-direction:column;gap:7px;}
    .meal-block{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    .meal-hdr{display:flex;align-items:center;justify-content:space-between;
      padding:8px 14px;border-bottom:1px solid var(--border);}
    .meal-lbl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--accent);}
    .add-btn{background:rgba(255,85,0,0.1);border:1px solid rgba(255,85,0,0.3);
      color:var(--accent);border-radius:6px;padding:2px 10px;font-size:13px;
      font-weight:700;cursor:pointer;font-family:var(--fb);}
    .food-rows{display:flex;flex-direction:column;}
    .food-row{display:flex;align-items:center;gap:8px;padding:9px 14px;
      border-bottom:1px solid var(--border);}
    .food-row:last-child{border-bottom:none;}
    .f-in{background:none;border:none;color:var(--text);font-size:14px;
      font-family:var(--fb);flex:1;outline:none;min-width:0;}
    .f-in::placeholder{color:var(--muted);}
    .k-in{background:none;border:none;color:var(--accent);font-family:var(--fd);
      font-size:18px;letter-spacing:1px;width:54px;outline:none;text-align:right;
      -webkit-appearance:none;flex-shrink:0;}
    .k-in::placeholder{color:var(--muted);}
    .k-unit{font-size:9px;color:var(--dim);flex-shrink:0;}
    .k-total{background:var(--card);border:1px solid var(--border);border-radius:12px;
      padding:11px 14px;display:flex;align-items:center;justify-content:space-between;}
    .k-total-lbl{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
    .k-total-num{font-family:var(--fd);font-size:24px;letter-spacing:1px;color:var(--accent);}
    .k-total-num span{font-size:11px;color:var(--dim);margin-left:2px;}
    .btn{display:block;margin:16px 18px 0;width:calc(100% - 36px);
      background:var(--accent);color:#fff;border:none;border-radius:12px;
      padding:16px;font-family:var(--fb);font-size:13px;font-weight:700;
      letter-spacing:2px;cursor:pointer;transition:opacity .15s,background .2s;}
    .btn:active{opacity:.82;}
    .btn.ok{background:var(--done);}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-date" id="dNum">—</div>
    <div class="hdr-day" id="dDay">—</div>
    <div class="tags" id="tags"></div>
  </div>
  <div class="sec">
    <div class="sec-lbl">計測</div>
    <div class="m-grid">
      <div class="m-card">
        <div class="m-name">体重</div>
        <div class="m-row">
          <input class="m-in" id="wt" type="number" inputmode="decimal" placeholder="65" step="0.1">
          <span class="m-unit">kg</span>
        </div>
      </div>
      <div class="m-card">
        <div class="m-name">体脂肪率</div>
        <div class="m-row">
          <input class="m-in" id="ft" type="number" inputmode="decimal" placeholder="18" step="0.1">
          <span class="m-unit">%</span>
        </div>
      </div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-lbl">今日のルーティン</div>
    <div class="r-stack" id="rList"></div>
  </div>
  <div class="sec">
    <div class="sec-lbl">食事</div>
    <div class="f-stack">
      <div class="meal-block">
        <div class="meal-hdr">
          <span class="meal-lbl">朝</span>
          <button class="add-btn" onclick="addRow('am')">＋ 追加</button>
        </div>
        <div class="food-rows" id="rows-am"></div>
      </div>
      <div class="meal-block">
        <div class="meal-hdr">
          <span class="meal-lbl">昼</span>
          <button class="add-btn" onclick="addRow('pm')">＋ 追加</button>
        </div>
        <div class="food-rows" id="rows-pm"></div>
      </div>
      <div class="meal-block">
        <div class="meal-hdr">
          <span class="meal-lbl">夜</span>
          <button class="add-btn" onclick="addRow('ev')">＋ 追加</button>
        </div>
        <div class="food-rows" id="rows-ev"></div>
      </div>
      <div class="k-total">
        <span class="k-total-lbl">合計カロリー</span>
        <div class="k-total-num" id="kTot">0<span>kcal</span></div>
      </div>
    </div>
  </div>
  <button class="btn" id="copyBtn" onclick="doCopy()">クロロに送る — コピー</button>
</div>
<script>
const ACT=[
  {key:'reading',label:'読書',        icon:'📚',days:[0,1,2,3,4,5,6]},
  {key:'train',  label:'トレーニング',icon:'💪',days:[1,3,5,6]},
  {key:'run',    label:'ランニング',  icon:'🏃',days:[2,4]},
  {key:'piano',  label:'ピアノ',      icon:'🎹',days:[1,3,5]},
];
const DAYJA=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
const DAYSHORT=['日','月','火','水','木','金','土'];

const KCAL_DB=[
  {keys:['納豆ご飯','納豆ごはん'],v:400},
  {keys:['ご飯','白飯','ごはん'],v:270},
  {keys:['おにぎり'],v:200},
  {keys:['パン','食パン','トースト'],v:160},
  {keys:['納豆'],v:100},
  {keys:['卵','たまご','目玉焼き','ゆで卵'],v:90},
  {keys:['オムレツ','オムライス'],v:500},
  {keys:['味噌汁','みそ汁'],v:30},
  {keys:['ヨーグルト'],v:80},
  {keys:['バナナ'],v:90},
  {keys:['プロテイン'],v:130},
  {keys:['定食'],v:850},
  {keys:['弁当','お弁当'],v:750},
  {keys:['カレー','カレーライス'],v:850},
  {keys:['ラーメン'],v:650},
  {keys:['うどん'],v:420},
  {keys:['そば'],v:400},
  {keys:['パスタ','スパゲッティ'],v:550},
  {keys:['チャーハン','炒飯'],v:620},
  {keys:['唐揚げ','からあげ'],v:550},
  {keys:['焼肉','焼き肉','やきにく'],v:650},
  {keys:['ハンバーグ'],v:500},
  {keys:['とんかつ','カツ'],v:750},
  {keys:['ステーキ'],v:650},
  {keys:['餃子','ぎょうざ'],v:320},
  {keys:['寿司','すし','回転寿司'],v:500},
  {keys:['ハンバーガー','バーガー'],v:600},
  {keys:['ピザ'],v:700},
  {keys:['サラダ'],v:80},
  {keys:['サンドイッチ'],v:380},
  {keys:['焼き魚','さば','鮭','さけ'],v:300},
  {keys:['鶏肉','チキン','とりにく'],v:300},
  {keys:['豚肉','ぶた'],v:400},
  {keys:['牛肉','ビーフ'],v:500},
  {keys:['鍋','なべ'],v:450},
  {keys:['牛乳','ミルク'],v:130},
  {keys:['コーヒー','お茶'],v:5},
  {keys:['コンビニ'],v:750},
  {keys:['外食'],v:900},
  {keys:['自炊'],v:600},
];

function guessKcal(name){
  if(!name)return null;
  const sorted=[...KCAL_DB].sort((a,b)=>b.keys[0].length-a.keys[0].length);
  for(const row of sorted){
    if(row.keys.some(k=>name.includes(k)))return row.v;
  }
  return null;
}

const now=new Date();
const dow=now.getDay();
const y=now.getFullYear();
const mo=String(now.getMonth()+1).padStart(2,'0');
const da=String(now.getDate()).padStart(2,'0');
document.getElementById('dNum').textContent=`${y}.${mo}.${da}`;
document.getElementById('dDay').textContent=DAYJA[dow];

const todayActs=ACT.filter(a=>a.days.includes(dow));
const state={};
const tagsEl=document.getElementById('tags');
todayActs.forEach(a=>{
  const t=document.createElement('span');
  t.className='tag';t.textContent=a.label;tagsEl.appendChild(t);
});
const rList=document.getElementById('rList');
if(!todayActs.length){
  rList.innerHTML='<div class="rest">今日はルーティンなし — ゆっくり休もう</div>';
}else{
  todayActs.forEach(act=>{
    state[act.key]=false;
    const c=document.createElement('div');
    c.className='r-card';c.id='c-'+act.key;
    c.innerHTML=`<div class="r-left"><div class="r-ico">${act.icon}</div><div class="r-lbl">${act.label}</div></div>
      <div class="chk"><svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2 6L4.5 8.5L10 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
    c.addEventListener('click',()=>{
      state[act.key]=!state[act.key];
      c.classList.toggle('done',state[act.key]);
    });
    rList.appendChild(c);
  });
}

function addRow(meal){
  const container=document.getElementById('rows-'+meal);
  const row=document.createElement('div');
  row.className='food-row';
  row.innerHTML=`<input class="f-in" type="text" placeholder="食べたもの">
    <input class="k-in" type="number" inputmode="numeric" placeholder="—">
    <span class="k-unit">kcal</span>`;
  const fIn=row.querySelector('.f-in');
  const kIn=row.querySelector('.k-in');
  function tryGuess(){const g=guessKcal(fIn.value);if(g!==null){kIn.value=g;updateTotal();}}
  fIn.addEventListener('input',tryGuess);
  fIn.addEventListener('blur',tryGuess);
  kIn.addEventListener('input',updateTotal);
  container.appendChild(row);
}

['am','pm','ev'].forEach(m=>addRow(m));

function updateTotal(){
  let total=0;
  document.querySelectorAll('.k-in').forEach(el=>{total+=parseFloat(el.value)||0;});
  document.getElementById('kTot').innerHTML=`${total}<span>kcal</span>`;
}

function getMealData(meal){
  const rows=document.querySelectorAll(`#rows-${meal} .food-row`);
  const items=[];
  rows.forEach(row=>{
    const f=row.querySelector('.f-in').value;
    const k=row.querySelector('.k-in').value;
    if(f||k)items.push({f:f||'',k:k||''});
  });
  return items;
}

function doCopy(){
  const wt=document.getElementById('wt').value;
  const ft=document.getElementById('ft').value;
  const ktot=Array.from(document.querySelectorAll('.k-in')).reduce((s,el)=>s+(parseFloat(el.value)||0),0);
  let t=`📅 ${y}/${mo}/${da}（${DAYSHORT[dow]}）\n\n`;
  t+=`⚖️ 体重：${wt||'未'}kg　体脂肪：${ft||'未'}%\n\n`;
  t+=`🍽️ 食事\n`;
  ['am','pm','ev'].forEach((m,i)=>{
    const label=['朝','昼','夜'][i];
    const items=getMealData(m);
    if(items.length===0){t+=`　${label}：未\n`;return;}
    items.forEach((item,j)=>{
      const prefix=j===0?`　${label}：`:`　　　`;
      t+=`${prefix}${item.f}${item.k?' '+item.k+'kcal':''}\n`;
    });
  });
  if(ktot>0)t+=`　合計：${ktot}kcal\n`;
  if(todayActs.length){
    t+=`\n🗒️ ルーティン\n`;
    todayActs.forEach(a=>{t+=`　${state[a.key]?'✅':'❌'} ${a.label}\n`;});
  }
  navigator.clipboard.writeText(t).then(flash).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);flash();
  });
}
function flash(){
  const b=document.getElementById('copyBtn');const o=b.textContent;
  b.textContent='コピーしました！';b.classList.add('ok');
  setTimeout(()=>{b.textContent=o;b.classList.remove('ok');},2000);
}
</script>
</body>
</html>
